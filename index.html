<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio</title>
<script src="js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=IBM+Plex+Mono:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/crt.css">
</head>
<body>

  <!-- The whole viewport is the monitor. -->
  <div id="screen">
    <button id="power-button" aria-label="Toggle power">⏼</button>

    <!-- text-canvas: 2D canvas where every character of the OS is drawn.
         Not to be shown directly and only exists as a
         WebGL texture source for the CRT compositor below. (info for cloners) -->
    <canvas id="text-canvas"></canvas>

    <!-- crt-canvas: WebGL canvas that samples text-canvas as a texture and
         applies barrel distortion, chromatic aberration, vignette, phosphor
         mask/aperture grille, scanlines, flicker, noise, sync glitches and
         raster drift. This is the only thing the visitor actually sees. -->
    <canvas id="crt-canvas"></canvas>

    <input id="hidden-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Terminal input" />

  </div>

  <script src="js/audio.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
