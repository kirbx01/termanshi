<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio</title>
<script src="js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=IBM+Plex+Mono:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/crt.css">
</head>
<body>

  <!-- The whole viewport is the monitor. -->
  <div id="screen">

    <!-- text-canvas: 2D canvas where every character of the OS is drawn.
         Not to be shown directly and only exists as a
         WebGL texture source for the CRT compositor below. (info for cloners) -->
    <canvas id="text-canvas"></canvas>

    <!-- crt-canvas: WebGL canvas that samples text-canvas as a texture and
         applies barrel distortion, chromatic aberration, vignette, phosphor
         mask/aperture grille, scanlines, flicker, noise, sync glitches and
         raster drift. This is the only thing the visitor actually sees. -->
    <canvas id="crt-canvas"></canvas>

    <div id="mobile-keyboard" aria-label="On-screen keyboard">
      <button data-key="Backspace">⌫</button>
      <button data-key="Enter">↵</button>
      <button data-key="Tab">Tab</button>
      <button data-key="Space">Space</button>
      <button data-key="ArrowUp">↑</button>
      <button data-key="ArrowDown">↓</button>
      <button data-key="ArrowLeft">←</button>
      <button data-key="ArrowRight">→</button>
      <button data-key="q">q</button>
      <button data-key="c">c</button>
      <button data-key="l">l</button>
      <button data-key="x">x</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="0">0</button>
      <button data-key="a">a</button>
      <button data-key="b">b</button>
      <button data-key="c">c</button>
      <button data-key="d">d</button>
      <button data-key="e">e</button>
      <button data-key="f">f</button>
      <button data-key="g">g</button>
      <button data-key="h">h</button>
      <button data-key="i">i</button>
      <button data-key="j">j</button>
      <button data-key="k">k</button>
      <button data-key="l">l</button>
      <button data-key="m">m</button>
      <button data-key="n">n</button>
      <button data-key="o">o</button>
      <button data-key="p">p</button>
      <button data-key="q">q</button>
      <button data-key="r">r</button>
      <button data-key="s">s</button>
      <button data-key="t">t</button>
      <button data-key="u">u</button>
      <button data-key="v">v</button>
      <button data-key="w">w</button>
      <button data-key="x">x</button>
      <button data-key="y">y</button>
      <button data-key="z">z</button>
      <button data-key="/">/</button>
      <button data-key="-">-</button>
      <button data-key=".">.</button>
      <button data-key=" ">Space</button>
    </div>

  </div>

  <script src="js/audio.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
